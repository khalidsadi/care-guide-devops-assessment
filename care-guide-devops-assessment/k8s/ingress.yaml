# Requires an ingress controller such as ingress-nginx.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  namespace: care-guide
spec:
  ingressClassName: nginx
  rules:
    - host: care-guide.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
