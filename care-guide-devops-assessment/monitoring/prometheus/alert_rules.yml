groups:
  - name: care-guide-alerts
    rules:
      - alert: AppInstanceDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application metrics endpoint is unavailable"
      - alert: HighApplicationErrorRate
        expr: rate(http_errors_total[5m]) / clamp_min(rate(http_requests_total[5m]), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Application error ratio is above 5%"
      - alert: HostDiskUsageHigh
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem usage is above 80%"
      - alert: ContainerMemoryNearLimit
        expr: (container_memory_working_set_bytes{container!=""} / container_spec_memory_limit_bytes{container!=""}) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container memory is above 90% of its limit"
