services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: care-guide-api:local
    container_name: care-guide-api
    ports:
      - "8080:8000"
    environment:
      PORT: "8000"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      APP_VERSION: "${APP_VERSION:-1.0.0}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.50
    networks: [internal]

networks:
  internal:
    driver: bridge
